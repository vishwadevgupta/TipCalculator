<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, responsive tip calculator with split-bill support, presets, currency selection, dark mode, and calculation history.">
  <title>TipWise — Smart Tip Calculator</title>
  <style>
    :root {
      --bg: #f4f7fb; --card: #fff; --text: #172033; --muted: #64748b;
      --primary: #2563eb; --primary-dark: #1d4ed8; --soft: #eff6ff;
      --border: #dbe3ef; --danger: #dc2626; --shadow: 0 20px 50px rgba(15,23,42,.10);
    }
    body.dark {
      --bg: #0f172a; --card: #172033; --text: #f8fafc; --muted: #94a3b8;
      --primary: #60a5fa; --primary-dark: #3b82f6; --soft: #1e3a5f;
      --border: #334155; --shadow: 0 20px 50px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:.2s; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(980px, calc(100% - 28px)); margin:0 auto; padding:32px 0 50px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; background:var(--primary); color:#fff; font-weight:800; font-size:20px; }
    h1 { margin:0; font-size:1.55rem; } header p { margin:3px 0 0; color:var(--muted); font-size:.85rem; }
    .icon-btn { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:10px; padding:9px 11px; }
    .grid { display:grid; grid-template-columns:1.05fr .95fr; gap:20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:25px; box-shadow:var(--shadow); }
    .card h2 { margin:0 0 20px; font-size:1.05rem; }
    .field { margin-bottom:18px; }
    label { display:flex; justify-content:space-between; margin-bottom:8px; font-weight:700; font-size:.88rem; }
    .hint { color:var(--muted); font-weight:500; font-size:.76rem; }
    .input-wrap { position:relative; }
    .currency { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:700; pointer-events:none; }
    input, select { width:100%; border:1px solid var(--border); background:transparent; color:var(--text); border-radius:11px; padding:12px 13px; outline:none; }
    .input-wrap input { padding-left:34px; }
    input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
    .presets { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
    .preset { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:9px; padding:9px 4px; font-weight:700; }
    .preset.active, .preset:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
    .range-row { display:flex; align-items:center; gap:12px; }
    input[type=range] { accent-color:var(--primary); padding:0; }
    .tip-value { min-width:48px; text-align:center; font-weight:800; color:var(--primary); }
    .people { display:grid; grid-template-columns:44px 1fr 44px; gap:8px; }
    .stepper { border:1px solid var(--border); background:var(--soft); color:var(--primary); border-radius:10px; font-size:1.2rem; font-weight:800; }
    .actions { display:flex; gap:9px; margin-top:5px; }
    .btn { flex:1; border:0; border-radius:11px; padding:12px; font-weight:800; }
    .primary { background:var(--primary); color:#fff; } .secondary { background:var(--soft); color:var(--primary); }
    .error { color:var(--danger); font-size:.76rem; min-height:18px; margin-top:5px; }
    .result-card { background:linear-gradient(145deg, var(--primary), var(--primary-dark)); color:#fff; }
    .result-card h2 { color:#fff; }
    .main-result { text-align:center; padding:5px 0 20px; border-bottom:1px solid rgba(255,255,255,.2); }
    .main-result span { opacity:.8; font-size:.82rem; } .main-result strong { display:block; font-size:2.7rem; margin-top:4px; }
    .results { display:grid; gap:3px; margin-top:14px; }
    .result-row { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.15); }
    .result-row:last-child { border:0; } .result-row span { opacity:.82; } .result-row strong { font-size:1rem; }
    .history { margin-top:20px; }
    .history-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .history-head h2 { margin:0; }
    .clear { border:0; background:none; color:var(--primary); font-size:.78rem; font-weight:700; }
    .history-list { display:grid; gap:8px; }
    .history-item { display:flex; justify-content:space-between; gap:10px; padding:11px 12px; border:1px solid var(--border); border-radius:10px; font-size:.8rem; }
    .history-item span { color:var(--muted); } .empty { color:var(--muted); font-size:.82rem; text-align:center; padding:10px; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } .app { padding-top:20px; } .presets { grid-template-columns:repeat(5,1fr); } }
    @media (max-width:420px) { .presets { grid-template-columns:repeat(3,1fr); } .card { padding:19px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="logo">%</div><div><h1>TipWise</h1><p>Simple, smart bill splitting</p></div></div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">🌙</button>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Bill details</h2>

        <div class="field">
          <label for="currency">Currency</label>
          <select id="currency" aria-label="Currency">
            <option value="USD">USD — $</option>
            <option value="INR">INR — ₹</option>
            <option value="EUR">EUR — €</option>
            <option value="GBP">GBP — £</option>
            <option value="AUD">AUD — A$</option>
            <option value="CAD">CAD — C$</option>
            <option value="SGD">SGD — S$</option>
          </select>
        </div>

        <div class="field">
          <label for="amount">Bill amount <span class="hint">before tip</span></label>
          <div class="input-wrap"><span class="currency" id="currencySymbol">$</span><input id="amount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal"></div>
          <div class="error" id="amountError"></div>
        </div>

        <div class="field">
          <label>Tip percentage <span class="hint">choose or slide</span></label>
          <div class="presets">
            <button class="preset" data-tip="10" type="button">10%</button>
            <button class="preset active" data-tip="15" type="button">15%</button>
            <button class="preset" data-tip="18" type="button">18%</button>
            <button class="preset" data-tip="20" type="button">20%</button>
            <button class="preset" data-tip="25" type="button">25%</button>
          </div>
          <div class="range-row" style="margin-top:12px;">
            <input id="tip" type="range" min="0" max="50" value="15" aria-label="Tip percentage">
            <span class="tip-value" id="tipValue">15%</span>
          </div>
        </div>

        <div class="field">
          <label for="people">Number of people</label>
          <div class="people">
            <button class="stepper" id="minus" type="button" aria-label="Decrease people">−</button>
            <input id="people" type="number" min="1" step="1" value="1" inputmode="numeric">
            <button class="stepper" id="plus" type="button" aria-label="Increase people">+</button>
          </div>
        </div>

        <div class="actions">
          <button class="btn secondary" id="reset" type="button">Reset</button>
          <button class="btn primary" id="save" type="button">Save calculation</button>
        </div>
      </section>

      <section class="card result-card">
        <h2>Your split</h2>
        <div class="main-result"><span>Total per person</span><strong id="totalPerPerson">$0.00</strong></div>
        <div class="results">
          <div class="result-row"><span>Tip per person</span><strong id="tipPerPerson">$0.00</strong></div>
          <div class="result-row"><span>Bill per person</span><strong id="billPerPerson">$0.00</strong></div>
          <div class="result-row"><span>Total tip</span><strong id="totalTip">$0.00</strong></div>
          <div class="result-row"><span>Total bill</span><strong id="grandTotal">$0.00</strong></div>
        </div>
      </section>
    </div>

    <section class="card history">
      <div class="history-head"><h2>Recent calculations</h2><button class="clear" id="clearHistory" type="button">Clear history</button></div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>
  <script src="index.js"></script>
</body>
</html>
