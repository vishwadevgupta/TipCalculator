<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TipWise — a premium, responsive tip calculator with split-bill support, multiple currencies, dark mode, and calculation history.">
  <title>TipWise — Smart Tip Calculator</title>
  <style>
    :root {
      --bg: #070914;
      --bg-2: #0c1020;
      --card: rgba(18, 23, 42, .72);
      --card-solid: #12172a;
      --text: #f7f8ff;
      --muted: #98a1bd;
      --primary: #8b5cf6;
      --primary-2: #4f8cff;
      --accent: #b794ff;
      --soft: rgba(139, 92, 246, .12);
      --border: rgba(255, 255, 255, .09);
      --danger: #ff6b7a;
      --shadow: 0 24px 70px rgba(0, 0, 0, .38);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(139, 92, 246, .22), transparent 34%),
        radial-gradient(circle at 90% 12%, rgba(79, 140, 255, .18), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg-2));
      transition: background .25s ease, color .25s ease;
    }

    body.light {
      --bg: #f5f7ff;
      --bg-2: #edf1ff;
      --card: rgba(255, 255, 255, .82);
      --card-solid: #fff;
      --text: #16182a;
      --muted: #68718a;
      --soft: rgba(124, 92, 246, .08);
      --border: rgba(30, 35, 60, .10);
      --shadow: 0 24px 70px rgba(50, 60, 100, .13);
      background:
        radial-gradient(circle at 10% 0%, rgba(139, 92, 246, .16), transparent 34%),
        radial-gradient(circle at 90% 12%, rgba(79, 140, 255, .14), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg-2));
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button, input, select { -webkit-tap-highlight-color: transparent; }

    .app { width: min(1060px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 64px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:14px; }
    .logo {
      width:48px; height:48px; border-radius:16px; display:grid; place-items:center;
      color:#fff; font-weight:900; font-size:21px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 10px 28px rgba(111, 82, 246, .34);
    }
    h1 { margin:0; font-size:1.65rem; letter-spacing:-.04em; }
    header p { margin:4px 0 0; color:var(--muted); font-size:.86rem; }

    .icon-btn {
      width:42px; height:42px; border:1px solid var(--border); border-radius:14px;
      background:var(--card); color:var(--text); box-shadow:var(--shadow);
      backdrop-filter: blur(18px); transition:transform .18s, border-color .18s;
    }
    .icon-btn:hover { transform:translateY(-2px); border-color:rgba(139,92,246,.45); }

    .grid { display:grid; grid-template-columns:1.03fr .97fr; gap:20px; align-items:stretch; }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:26px; padding:27px;
      box-shadow:var(--shadow); backdrop-filter:blur(20px);
    }
    .card h2 { margin:0 0 22px; font-size:1rem; letter-spacing:-.01em; }

    .field { margin-bottom:20px; }
    label { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; font-weight:750; font-size:.84rem; }
    .hint { color:var(--muted); font-weight:500; font-size:.74rem; }

    .input-wrap { position:relative; }
    .currency { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:800; pointer-events:none; }
    input, select {
      width:100%; border:1px solid var(--border); background:rgba(255,255,255,.035); color:var(--text);
      border-radius:14px; padding:13px 14px; outline:none; transition:border-color .18s, box-shadow .18s, background .18s;
    }
    select { appearance:auto; }
    .input-wrap input { padding-left:38px; font-size:1.02rem; font-weight:650; }
    input::placeholder { color:var(--muted); opacity:.55; }
    input:focus, select:focus {
      border-color:rgba(139,92,246,.75);
      box-shadow:0 0 0 4px rgba(139,92,246,.11);
      background:rgba(139,92,246,.035);
    }

    .presets { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .preset {
      border:1px solid var(--border); background:rgba(255,255,255,.025); color:var(--muted);
      border-radius:12px; padding:10px 4px; font-weight:750; transition:.18s;
    }
    .preset:hover { transform:translateY(-1px); color:var(--text); border-color:rgba(139,92,246,.45); }
    .preset.active {
      color:#fff; border-color:transparent;
      background:linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow:0 8px 22px rgba(111,82,246,.25);
    }

    .range-row { display:flex; align-items:center; gap:13px; }
    input[type=range] { appearance:none; height:5px; padding:0; border:0; background:linear-gradient(90deg, var(--primary), var(--primary-2)); border-radius:999px; }
    input[type=range]::-webkit-slider-thumb {
      appearance:none; width:18px; height:18px; border-radius:50%; background:#fff;
      border:4px solid var(--primary); box-shadow:0 2px 10px rgba(0,0,0,.25);
    }
    .tip-value { min-width:48px; text-align:center; font-weight:850; color:var(--accent); }

    .people { display:grid; grid-template-columns:44px 1fr 44px; gap:8px; }
    .stepper {
      border:1px solid var(--border); background:var(--soft); color:var(--accent);
      border-radius:13px; font-size:1.2rem; font-weight:850; transition:.18s;
    }
    .stepper:hover { background:rgba(139,92,246,.2); transform:translateY(-1px); }
    #people { text-align:center; font-weight:750; }

    .actions { display:flex; gap:10px; margin-top:4px; }
    .btn {
      flex:1; border:0; border-radius:14px; padding:13px; font-weight:800; transition:.18s;
    }
    .btn:hover { transform:translateY(-2px); }
    .primary { color:#fff; background:linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow:0 10px 25px rgba(93,82,246,.23); }
    .secondary { color:var(--text); background:var(--soft); border:1px solid var(--border); }

    .error { color:var(--danger); font-size:.76rem; min-height:18px; margin-top:5px; }

    .result-card {
      position:relative; overflow:hidden; color:#fff;
      background:
        radial-gradient(circle at 90% 5%, rgba(255,255,255,.20), transparent 30%),
        radial-gradient(circle at 5% 90%, rgba(79,140,255,.30), transparent 35%),
        linear-gradient(145deg, #7654e9, #356ee8);
      border-color:rgba(255,255,255,.15);
    }
    .result-card::after {
      content:""; position:absolute; width:180px; height:180px; right:-80px; bottom:-100px;
      border-radius:50%; border:1px solid rgba(255,255,255,.16); box-shadow:0 0 0 25px rgba(255,255,255,.025), 0 0 0 50px rgba(255,255,255,.02);
    }
    .result-card h2 { color:#fff; position:relative; z-index:1; }
    .main-result { position:relative; z-index:1; text-align:center; padding:13px 0 24px; border-bottom:1px solid rgba(255,255,255,.18); }
    .main-result span { opacity:.78; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
    .main-result strong { display:block; font-size:3.15rem; line-height:1.05; letter-spacing:-.06em; margin-top:9px; }
    .results { position:relative; z-index:1; display:grid; gap:0; margin-top:10px; }
    .result-row { display:flex; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid rgba(255,255,255,.13); }
    .result-row:last-child { border:0; }
    .result-row span { opacity:.76; font-size:.84rem; }
    .result-row strong { font-size:.98rem; }

    .history { margin-top:20px; }
    .history-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .history-head h2 { margin:0; }
    .clear { border:0; background:none; color:var(--accent); font-size:.78rem; font-weight:750; padding:4px; }
    .history-list { display:grid; gap:8px; }
    .history-item {
      display:flex; justify-content:space-between; gap:10px; padding:12px 14px;
      border:1px solid var(--border); border-radius:13px; background:rgba(255,255,255,.02); font-size:.8rem;
    }
    .history-item span { color:var(--muted); }
    .empty { color:var(--muted); font-size:.82rem; text-align:center; padding:12px; }

    @media (max-width:760px) {
      .app { padding-top:22px; }
      .grid { grid-template-columns:1fr; }
      .result-card { min-height:360px; }
    }
    @media (max-width:460px) {
      .app { width:min(100% - 20px, 1060px); }
      .card { padding:20px; border-radius:22px; }
      .presets { grid-template-columns:repeat(3,1fr); }
      .main-result strong { font-size:2.7rem; }
      .actions { flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">%</div>
        <div><h1>TipWise</h1><p>Simple, smart bill splitting</p></div>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">☀️</button>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Bill details</h2>

        <div class="field">
          <label for="currency">Currency</label>
          <select id="currency" aria-label="Currency">
            <option value="USD">USD — $</option>
            <option value="INR">INR — ₹</option>
            <option value="EUR">EUR — €</option>
            <option value="GBP">GBP — £</option>
            <option value="AUD">AUD — A$</option>
            <option value="CAD">CAD — C$</option>
            <option value="SGD">SGD — S$</option>
          </select>
        </div>

        <div class="field">
          <label for="amount">Bill amount <span class="hint">before tip</span></label>
          <div class="input-wrap"><span class="currency" id="currencySymbol">$</span><input id="amount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal"></div>
          <div class="error" id="amountError"></div>
        </div>

        <div class="field">
          <label>Tip percentage <span class="hint">choose or slide</span></label>
          <div class="presets">
            <button class="preset" data-tip="10" type="button">10%</button>
            <button class="preset active" data-tip="15" type="button">15%</button>
            <button class="preset" data-tip="18" type="button">18%</button>
            <button class="preset" data-tip="20" type="button">20%</button>
            <button class="preset" data-tip="25" type="button">25%</button>
          </div>
          <div class="range-row" style="margin-top:13px;">
            <input id="tip" type="range" min="0" max="50" value="15" aria-label="Tip percentage">
            <span class="tip-value" id="tipValue">15%</span>
          </div>
        </div>

        <div class="field">
          <label for="people">Number of people</label>
          <div class="people">
            <button class="stepper" id="minus" type="button" aria-label="Decrease people">−</button>
            <input id="people" type="number" min="1" step="1" value="1" inputmode="numeric">
            <button class="stepper" id="plus" type="button" aria-label="Increase people">+</button>
          </div>
        </div>

        <div class="actions">
          <button class="btn secondary" id="reset" type="button">Reset</button>
          <button class="btn primary" id="save" type="button">Save calculation</button>
        </div>
      </section>

      <section class="card result-card">
        <h2>Your split</h2>
        <div class="main-result"><span>Total per person</span><strong id="totalPerPerson">$0.00</strong></div>
        <div class="results">
          <div class="result-row"><span>Tip per person</span><strong id="tipPerPerson">$0.00</strong></div>
          <div class="result-row"><span>Bill per person</span><strong id="billPerPerson">$0.00</strong></div>
          <div class="result-row"><span>Total tip</span><strong id="totalTip">$0.00</strong></div>
          <div class="result-row"><span>Total bill</span><strong id="grandTotal">$0.00</strong></div>
        </div>
      </section>
    </div>

    <section class="card history">
      <div class="history-head"><h2>Recent calculations</h2><button class="clear" id="clearHistory" type="button">Clear history</button></div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>
  <script src="index.js"></script>
</body>
</html>
